component: CS-02

name: EcosystemAnalysis

version: 0.2.0

status: Draft

depends_on:
  - CS-01 ComplexSystem

purpose:
  description: >
    Measure the transition of a complex system from a closed solution to an
    ecosystem, following the model S = (V, E, w, A, ω, F, Θ).

model_mapping:

  V: ComplexSystem.components (Component)
  V_ext: components with scope == "external"
  E: relationships whose relationship_type is in DEPENDENCY_TYPES
  w: Relationship.weight
  A: ComplexSystem.actors (Actor)
  ω: Component.owner_id
  F: ComplexSystem.value_functions (ValueFunction)
  Θ: Component.availability (A), Component.control (γ), Component.failure_rate (λ)

conventions:
  dependency_direction: (i, j) ∈ E means i depends on j
  DEPENDENCY_TYPES: ["depends_on"]
  path_element: a component id (serial) or a tuple of ids (redundant group)

interfaces:

  structure:
    module: tool_angel.complex_systems.analysis.structure
    functions:
      openness: "Ω ∈ [0, 1]"
      coordination_cost: "τ ∈ [0, 1]"
      ownership_entropy: "H_B ∈ [0, 1]"
      relational_value: "ρ_V ∈ [0, 1]"
      criticality: "dict[UUID, float] π_v"
      effective_control: "K ∈ [0, 1]"

  reliability:
    module: tool_angel.complex_systems.analysis.reliability
    functions:
      function_availability: "A_f"
      system_availability: "A_sys = Σ φ_f A_f"
      structural_impact: "dict[UUID, float] Δ_e for every external e"
      structural_dependencies: "external ids with Δ_e > θ"
      is_composite: "bool"

  propagation:
    module: tool_angel.complex_systems.analysis.propagation
    functions:
      dependency_matrix: "D and the component order"
      reach: "dict[UUID, int], independent of α"
      katz_impact: "dict[UUID, float] 𝓘_j"
      has_cycles: "bool"
      instability: "dict[UUID, float] Martin I_v"

  risk:
    module: tool_angel.complex_systems.analysis.risk
    functions:
      provider_risks: "list[ProviderRisk], highest first"
      expected_risk: "E[R] = Σ λ_e Δ_e (1 − γ_e)(1 + 𝓘_e)"

  sensitivity:
    module: tool_angel.complex_systems.analysis.sensitivity
    functions:
      weight_uncertainty: "ICE mean, p5, p95, class probabilities under β ~ Dirichlet(1)"
      rank_stability: "share of weightings where system 1 scores higher"
      leave_one_out: "ICE without each signal"
      theta_sensitivity: "ICE per θ"
      alpha_sensitivity: "E[R] per α"
      common_cause_unavailability: "β-factor Q_g"
      redundancy_penalty: "Q_g(β) / Q_g(0) per redundant group"

  io:
    module: tool_angel.complex_systems.io
    schema: schemas/ecosystem.schema.json
    functions:
      system_from_dict: "(ComplexSystem, code → id)"
      load_system: "(ComplexSystem, code → id, parameters)"

  cli:
    command: "ecosystem analyze <file> [theta=<float>] [alpha=<float>]"
    module: tool_angel.builtin_commands.ecosystem

  self_analysis:
    script: scripts/self_analysis.py
    options: ["--fail-on-cycles", "--strict-instability <float>"]

  index:
    module: tool_angel.complex_systems.analysis.index
    functions:
      signals: "Signals(s1..s5)"
      ice: "β·s"
      classify: "closed | transition | ecosystem"
      analyze: "EcosystemReport with every operator above"

invariants:
  - "0 ≤ Ω, τ, H_B, ρ_V, K, s_k, ICE ≤ 1"
  - "τ ≤ Ω when internal ownership is a single actor (Proposition 2)"
  - "reach is identical for every α > 0"
  - "analysis functions never mutate the ComplexSystem"

errors:
  ValueError:
    - "a dependency or path element references an unknown component"
    - "value-function weights do not sum to 1"
    - "α ≥ 1/ρ(D) on a cyclic graph"
    - "a dependency is duplicated or makes a component depend on itself"
    - "a component appears more than once in a critical path"
    - "availability or analyze() is requested on a system without value functions"
    - "a system file does not follow the schema (when jsonschema is installed)"

notes:
  - "D in the Katz impact is binary; dependency weights feed Ω and τ only."

out_of_scope_for_0_2_0:
  - empirical calibration of θ, α, β_cc and the ICE thresholds (validation protocol, phases 1–4)
  - correlated failures beyond the β-factor model

[project]
name = "tool-angel"
version = "0.1.0"
description = "TOOL-ANGEL (AngelOS) foundation: kernel, SDK, complex systems and ecosystem analysis."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

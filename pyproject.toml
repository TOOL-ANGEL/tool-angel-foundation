[project]
name = "tool-angel"
version = "0.1.0"
description = "TOOL-ANGEL (AngelOS) foundation: kernel, SDK, complex systems and ecosystem analysis."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
dev = ["pytest>=8.0", "jsonschema>=4.18"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

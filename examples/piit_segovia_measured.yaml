# Case study of Part III with the CS-03 measurement format.
# ILLUSTRATIVE evidence: it shows the format of a 12-month field record and how
# its uncertainty reaches the ICE. Replace every block with real monitoring
# logs, incident histories and contract reviews before drawing conclusions.
system: Plataforma municipal PIIT (medida)
